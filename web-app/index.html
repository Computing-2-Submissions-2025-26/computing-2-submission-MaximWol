<!doctype html>

<html lang="en-gb">

<head>

    <meta charset="utf-8">

    <title>Mastermind</title>

    <link rel="stylesheet" href="default.css">

    <script type="module" src="main.js"></script>

</head>

<body>

    <div id="code-setter-screen" class="screen red-theme">

        <h1>CODE SETTER</h1>

        <p>Create the secret code</p>

        <div id="secret-preview" class="peg-row"></div>

        <div class="colour-palette">

            <button class="colour-button red" data-colour="red"></button>

            <button class="colour-button green" data-colour="green"></button>

            <button class="colour-button blue" data-colour="blue"></button>

            <button class="colour-button yellow" data-colour="yellow"></button>

            <button class="colour-button white" data-colour="white"></button>

            <button class="colour-button black" data-colour="black"></button>

        </div>

        <div class="control-buttons">

            <button id="secret-clear-button">
                Clear
            </button>

            <button id="secret-confirm-button">
                Confirm Secret Code
            </button>

        </div>

    </div>

    <div id="transition-screen" class="screen hidden transition-theme">

        <h1>PASS DEVICE TO CODEBREAKER</h1>

        <button id="start-game-button">
            Continue
        </button>

    </div>

    <div id="code-breaker-screen" class="screen hidden blue-theme">

        <h1>CODE BREAKER</h1>

        <p>
            Attempts Remaining:
            <span id="attempts-remaining">10</span>
        </p>

        <div id="guess-preview" class="peg-row"></div>

        <div class="colour-palette">

            <button class="colour-button red" data-colour="red"></button>

            <button class="colour-button green" data-colour="green"></button>

            <button class="colour-button blue" data-colour="blue"></button>

            <button class="colour-button yellow" data-colour="yellow"></button>

            <button class="colour-button white" data-colour="white"></button>

            <button class="colour-button black" data-colour="black"></button>

        </div>

        <div class="control-buttons">

            <button id="guess-clear-button">
                Clear
            </button>

            <button id="submit-guess-button">
                Submit Guess
            </button>

        </div>

        <div id="game-message"></div>

        <div id="guess-history"></div>

        <button id="reset-button">RESET GAME</button>
    </div>

</body>

</html>
